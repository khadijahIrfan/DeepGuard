{% extends "base.html" %}

{% block title %}User Profile — DeepGuard{% endblock %}
{% block page_title %}Account Profile & Settings{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">

  <!-- User Account Card -->
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:var(--primary);fill:none;stroke-width:2;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Personal Information
      </h3>
      <span class="chip chip-info">User Account</span>
    </div>

    <div class="card-body">
      <form action="{{ url_for('update_profile') }}" method="POST">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" name="name" id="name" class="input-control" value="{{ user.name }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" name="email" id="email" class="input-control" value="{{ user.email }}" required>
        </div>

        <div class="form-group">
          <label class="form-label">Account Member Since</label>
          <input type="text" class="input-control" value="{{ user.created_at.strftime('%B %d, %Y') if user.created_at else 'N/A' }}" disabled style="opacity:0.6;">
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:var(--space-2);">
          Save Profile Changes
        </button>
      </form>
    </div>
  </div>

  <!-- Change Password Card -->
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:var(--primary);fill:none;stroke-width:2;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Security & Password
      </h3>
    </div>

    <div class="card-body">
      <form action="{{ url_for('change_password') }}" method="POST">
        <div class="form-group">
          <label class="form-label" for="current_password">Current Password</label>
          <input type="password" name="current_password" id="current_password" class="input-control" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="new_password">New Password</label>
          <input type="password" name="new_password" id="new_password" class="input-control" placeholder="At least 8 characters" required minlength="8">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm New Password</label>
          <input type="password" name="confirm_password" id="confirm_password" class="input-control" required minlength="8">
        </div>

        <button type="submit" class="btn btn-secondary" style="margin-top:var(--space-2);">
          Update Password
        </button>
      </form>
    </div>
  </div>

</div>
{% endblock %}
